<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taschenrechner</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-primary: #0f0f1a;
    --bg-secondary: #16162a;
    --bg-display: #0d0d18;
    --accent-1: #6c5ce7;
    --accent-2: #a855f7;
    --accent-3: #ec4899;
    --accent-glow: rgba(108, 92, 231, 0.4);
    --text-primary: #e8e8f0;
    --text-secondary: #9a9ab5;
    --btn-num: linear-gradient(145deg, #2a2a3e, #1e1e30);
    --btn-op: linear-gradient(145deg, #6c5ce7, #a855f7);
    --btn-func: linear-gradient(145deg, #ec4899, #f06292);
    --btn-eq: linear-gradient(145deg, #00b894, #00cec9);
    --btn-clear: linear-gradient(145deg, #e74c3c, #ff6b81);
    --btn-mem: linear-gradient(145deg, #f39c12, #f1c40f);
    --shadow-btn: 0 4px 15px rgba(0,0,0,0.3);
    --shadow-glow: 0 0 20px rgba(108,92,231,0.15);
    --radius: 16px;
    --radius-sm: 12px;
  }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow-x: hidden;
  }

  /* Animated background */
  body::before {
    content: '';
    position: fixed;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: radial-gradient(ellipse at 30% 40%, rgba(108,92,231,0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 60%, rgba(236,72,153,0.04) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(0,184,148,0.03) 0%, transparent 50%);
    animation: bgShift 20s ease-in-out infinite alternate;
    pointer-events: none;
    z-index: 0;
  }

  @keyframes bgShift {
    0%   { transform: translate(0, 0) rotate(0deg); }
    100% { transform: translate(-5%, -3%) rotate(2deg); }
  }

  .calculator {
    position: relative;
    z-index: 1;
    width: 420px;
    max-width: 95vw;
    background: var(--bg-secondary);
    border-radius: 24px;
    padding: 28px;
    box-shadow: 0 25px 60px rgba(0,0,0,0.5), var(--shadow-glow);
    border: 1px solid rgba(255,255,255,0.04);
    backdrop-filter: blur(20px);
  }

  /* Header */
  .calc-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    padding-bottom: 16px;
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }

  .calc-header h1 {
    font-size: 20px;
    font-weight: 700;
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .mode-toggle {
    display: flex;
    gap: 4px;
    background: rgba(255,255,255,0.04);
    border-radius: 8px;
    padding: 2px;
  }

  .mode-toggle button {
    background: none;
    border: none;
    color: var(--text-secondary);
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s;
    font-weight: 600;
  }

  .mode-toggle button.active {
    background: var(--accent-1);
    color: white;
    box-shadow: 0 2px 8px rgba(108,92,231,0.4);
  }

  .mode-toggle button:hover:not(.active) { color: var(--text-primary); }

  /* Display */
  .display {
    background: var(--bg-display);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 18px;
    border: 1px solid rgba(255,255,255,0.04);
    min-height: 130px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    position: relative;
    overflow: hidden;
  }

  .display::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(108,92,231,0.3), transparent);
  }

  .display-history {
    font-size: 14px;
    color: var(--text-secondary);
    text-align: right;
    min-height: 20px;
    margin-bottom: 4px;
    word-break: break-all;
    opacity: 0.7;
  }

  .display-main {
    font-size: 36px;
    font-weight: 700;
    text-align: right;
    color: var(--text-primary);
    word-break: break-all;
    line-height: 1.2;
    transition: color 0.3s;
  }

  .display-main.error { color: var(--accent-3); font-size: 28px; }

  .display-memory-indicator {
    position: absolute;
    top: 12px; left: 14px;
    font-size: 11px;
    color: var(--accent-2);
    opacity: 0;
    transition: opacity 0.3s;
    font-weight: 600;
  }

  .display-memory-indicator.visible { opacity: 1; }

  /* Memory display */
  .memory-display {
    font-size: 12px;
    color: var(--accent-2);
    text-align: right;
    margin-bottom: 6px;
    min-height: 18px;
    opacity: 0.5;
  }

  /* Buttons */
  .buttons {
    display: grid;
    gap: 8px;
  }

  .btn {
    border: none;
    border-radius: var(--radius-sm);
    font-size: 18px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s ease;
    position: relative;
    overflow: hidden;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .btn::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at var(--mx, 50%) var(--my, 50%), rgba(255,255,255,0.15), transparent 60%);
    opacity: 0;
    transition: opacity 0.3s;
  }

  .btn:hover::after { opacity: 1; }

  .btn:active {
    transform: scale(0.96);
    box-shadow: none !important;
  }

  .btn:active::after { opacity: 0.3; }

  /* Ripple effect */
  .ripple {
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    transform: scale(0);
    animation: rippleAnim 0.4s ease-out;
    pointer-events: none;
  }

  @keyframes rippleAnim {
    to { transform: scale(4); opacity: 0; }
  }

  /* Number buttons */
  .btn-num {
    background: var(--btn-num);
    color: var(--text-primary);
    box-shadow: var(--shadow-btn);
  }

  .btn-num:hover {
    background: linear-gradient(145deg, #3a3a50, #2e2e44);
    box-shadow: 0 6px 20px rgba(108,92,231,0.15);
  }

  /* Operator buttons */
  .btn-op {
    background: var(--btn-op);
    color: white;
    box-shadow: 0 4px 15px rgba(108,92,231,0.3);
  }

  .btn-op:hover {
    box-shadow: 0 6px 25px rgba(108,92,231,0.4);
    filter: brightness(1.1);
  }

  /* Function buttons */
  .btn-func {
    background: var(--btn-func);
    color: white;
    box-shadow: 0 4px 15px rgba(236,72,153,0.2);
    font-size: 14px;
  }

  .btn-func:hover {
    box-shadow: 0 6px 25px rgba(236,72,153,0.3);
    filter: brightness(1.1);
  }

  /* Equals button */
  .btn-eq {
    background: var(--btn-eq);
    color: white;
    box-shadow: 0 4px 15px rgba(0,184,148,0.3);
    font-size: 22px;
  }

  .btn-eq:hover {
    box-shadow: 0 6px 25px rgba(0,184,148,0.4);
    filter: brightness(1.1);
  }

  /* Clear button */
  .btn-clear {
    background: var(--btn-clear);
    color: white;
    box-shadow: 0 4px 15px rgba(231,76,60,0.2);
    font-size: 14px;
  }

  .btn-clear:hover {
    box-shadow: 0 6px 25px rgba(231,76,60,0.3);
    filter: brightness(1.1);
  }

  /* Memory buttons */
  .btn-mem {
    background: var(--btn-mem);
    color: #1a1a2e;
    box-shadow: 0 4px 15px rgba(243,156,18,0.2);
    font-size: 14px;
  }

  .btn-mem:hover {
    box-shadow: 0 6px 25px rgba(243,156,18,0.3);
    filter: brightness(1.1);
  }

  /* Scientific buttons */
  .btn-sci {
    background: linear-gradient(145deg, #2d2d4a, #202038);
    color: var(--accent-1);
    box-shadow: 0 4px 12px rgba(108,92,231,0.1);
    font-size: 14px;
  }

  .btn-sci:hover {
    box-shadow: 0 6px 20px rgba(108,92,231,0.2);
    filter: brightness(1.15);
  }

  /* Span helpers */
  .span-2 { grid-column: span 2; }
  .span-row { grid-row: span 2; }

  /* Keyboard hint */
  .keyboard-hint {
    text-align: center;
    margin-top: 16px;
    font-size: 12px;
    color: var(--text-secondary);
    opacity: 0.5;
  }

  .keyboard-hint kbd {
    background: rgba(255,255,255,0.06);
    padding: 1px 6px;
    border-radius: 4px;
    font-family: inherit;
    font-size: 11px;
  }

  /* Toast notification */
  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--accent-1);
    color: white;
    padding: 10px 24px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 600;
    box-shadow: 0 8px 30px rgba(108,92,231,0.4);
    transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 100;
    pointer-events: none;
  }

  .toast.show { transform: translateX(-50%) translateY(0); }

  /* Responsive */
  @media (max-width: 460px) {
    .calculator { padding: 18px; border-radius: 20px; }
    .display-main { font-size: 30px; }
    .btn { font-size: 16px; padding: 14px 8px; }
    .btn-func, .btn-mem { font-size: 12px; }
    .display { padding: 16px; min-height: 100px; }
  }

  /* Dark mode toggle */
  .theme-toggle {
    background: none;
    border: none;
    color: var(--text-secondary);
    cursor: pointer;
    font-size: 16px;
    padding: 4px;
    border-radius: 6px;
    transition: all 0.2s;
  }

  .theme-toggle:hover { color: var(--text-primary); background: rgba(255,255,255,0.04); }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
